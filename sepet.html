<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MağazaApp - Sepetim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h2><a href="index.html" class="logo-link">MağazaApp</a></h2>
        <nav style="display: flex; align-items: center; gap: 20px;">
            <a href="sepet.html" style="font-size: 18px; text-decoration: none; color: white;" title="Sepetim">🛒 <span id="cart-count">0</span></a>
            <button id="open-drawer-btn" class="nav-link-btn">Ürünler ▾</button>
        </nav>
    </header>

    <!-- Yandan Açılır Kategori Menüsü (Drawer) -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="sidebar-drawer" class="sidebar-drawer">
        <div class="drawer-header">
            <h3>Kategoriler</h3>
            <button id="close-drawer-btn" class="close-drawer">&times;</button>
        </div>
        <ul class="drawer-menu">
            <li><a href="urunler.html?category=Tümü"><span>📦</span> Tüm Ürünler</a></li>
            <li><a href="urunler.html?category=Elektronik"><span>⚡</span> Elektronik</a></li>
            <li><a href="urunler.html?category=Aksesuar"><span>🎒</span> Aksesuar</a></li>
            <li><a href="urunler.html?category=Giyim"><span>👕</span> Giyim</a></li>
            <li><a href="urunler.html?category=Ev %26 Yaşam"><span>🏠</span> Ev & Yaşam</a></li>
        </ul>
    </aside>

    <main>
        <div class="cart-container">
            <h1>Sepetim</h1>
            
            <div id="cart-items-container" class="cart-items">
                <!-- JavaScript sepeti dolduracak -->
            </div>

            <div class="cart-summary">
                <div class="total-text">
                    <span>Toplam Tutar:</span>
                    <span id="cart-total-price" class="total-price">0 TL</span>
                </div>
                <div class="cart-actions">
                    <button id="clear-cart-btn" class="clear-cart-btn" onclick="clearCart()">Sepeti Temizle</button>
                    <button id="checkout-btn" class="checkout-btn">Satın Al</button>
                </div>
            </div>
        </div>

        <!-- Ödeme Modalı -->
        <div id="checkout-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2>Sipariş Bilgileri</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label>Ad Soyad</label>
                        <input type="text" id="fullname" required placeholder="Adınızı giriniz...">
                    </div>
                    <div class="form-group">
                        <label>Teslimat Adresi</label>
                        <textarea id="address" rows="3" required placeholder="Adresinizi giriniz..."></textarea>
                    </div>
                    <button type="submit" class="contact-submit-btn">Siparişi Onayla</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div style="margin-bottom: 10px;">
            <a href="iletisim.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#00ff00'" onmouseout="this.style.color='#9ca3af'">İletişim & Destek</a>
        </div>
       <p>&copy; E-Ticaret Sitesi . KYNT</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
