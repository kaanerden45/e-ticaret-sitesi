<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Tİcaret Sitesi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
        <h2><a href="index.html" class="logo-link">E-Tİcaret Sitesi</a></h2>
        <nav style="display: flex; align-items: center; gap: 20px;">
            <a href="sepet.html" style="font-size: 18px; text-decoration: none; color: white;" title="Sepetim">🛒 <span id="cart-count">0</span></a>
            <button id="open-drawer-btn" class="nav-link-btn">Ürünler ▾</button>
        </nav>
    </header>

    <!-- Yandan Açılır Kategori Menüsü (Drawer) -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="sidebar-drawer" class="sidebar-drawer">
        <div class="drawer-header">
            <h3>Kategoriler</h3>
            <button id="close-drawer-btn" class="close-drawer">&times;</button>
        </div>
        <ul class="drawer-menu">
            <li><a href="urunler.html?category=Tümü"><span>📦</span> Tüm Ürünler</a></li>
            <li><a href="urunler.html?category=Elektronik"><span>⚡</span> Elektronik</a></li>
            <li><a href="urunler.html?category=Aksesuar"><span>🎒</span> Aksesuar</a></li>
            <li><a href="urunler.html?category=Giyim"><span>👕</span> Giyim</a></li>
            <li><a href="urunler.html?category=Ev %26 Yaşam"><span>🏠</span> Ev & Yaşam</a></li>
        </ul>
    </aside>

    <main>
        <div class="product-detail-container">
            <div class="product-image-box">
                <div class="product-badge-img" style="height: 300px;">
                    <span id="detail-badge-icon" class="badge-icon" style="font-size: 72px;">⚡</span>
                    <span id="detail-cat-name" class="badge-cat" style="font-size: 15px;">Elektronik</span>
                </div>
            </div>
            <div class="product-info-box">
                <h1 id="detail-title">Yükleniyor...</h1>
                <p id="detail-price" class="detail-price">0 TL</p>
                <p id="detail-desc" class="product-description">Açıklama yükleniyor...</p>
                
                <div class="quantity-box">
                    <label>Adet:</label>
                    <input type="number" value="1" min="1" class="qty-input" id="detail-qty">
                </div>
                
                <button class="add-to-cart-btn">Sepete Ekle</button>
                <div style="margin-top: 20px;">
                    <a href="urunler.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">← Ürünlere Geri Dön</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div style="margin-bottom: 10px;">
            <a href="iletisim.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#00ff00'" onmouseout="this.style.color='#9ca3af'">İletişim & Destek</a>
        </div>
        <p>&copy; E-Ticaret Sitesi . KYNT</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
